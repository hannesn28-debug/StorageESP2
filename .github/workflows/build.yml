name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dateien einsortieren
        run: |
          mkdir -p src/main/java/storagefinder src/main/resources/assets/storagefinder/lang
          for f in *.java; do [ -e "$f" ] && mv -f "$f" src/main/java/storagefinder/ || true; done
          for f in de_de.json en_us.json; do [ -e "$f" ] && mv -f "$f" src/main/resources/assets/storagefinder/lang/ || true; done
          [ -e fabric.mod.json ] && mv -f fabric.mod.json src/main/resources/ || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.0

      - name: Build
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: storagefinder-jar
          path: build/libs/storagefinder-1.0.0.jar
